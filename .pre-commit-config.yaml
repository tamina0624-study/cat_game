repos:
  - repo: local
    hooks:
      - id: project-security
        name: Gitleaks and local privacy checks
        entry: work/python-embed/python.exe 02.src/tools/check_security.py
        language: system
        require_serial: true
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        exclude: ^02\.src/public/(models/.*\.glb|screenshots/.*\.png)$
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
